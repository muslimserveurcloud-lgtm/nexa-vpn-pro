name: Compiler NEXA VPN PRO (APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK (Debug)
        run: gradle assembleDebug --stacktrace

      - name: Téléverser l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-vpn-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier Release avec l'APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "NEXA VPN PRO v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ### 🛡️ NEXA VPN PRO — Version Android prête à installer
            - Compilation automatique par GitHub Actions
            - Protocoles : SSH, UDP Custom, DNST (DNS Tunnel), VLESS/Vitora
            - Gestion par token & vérification Hardware ID (NEXA-*)
            
            **Téléchargez le fichier `app-debug.apk` ci-dessous et installez-le sur votre téléphone Android.**
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
