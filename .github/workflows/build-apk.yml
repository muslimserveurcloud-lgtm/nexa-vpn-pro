name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Préparation du SDK Android et NDK
      - name: Préparer le SDK et le NDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      # Compilation native de tun2socks (hev-socks5-tunnel) avec patch JNI_OnLoad
      - name: Compiler tun2socks (hev-socks5-tunnel)
        run: |
          mkdir -p tun/jni
          cd tun/jni
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git
          echo 'include $(call all-subdir-makefiles)' > Android.mk
          printf 'APP_CFLAGS := -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService\n' > Application.mk

          python3 -c '
          path = "hev-socks5-tunnel/src/hev-jni.c"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()
          old = "res = (*vm)->GetEnv (vm, (void **)&env, JNI_VERSION_1_4);\n    if (res != JNI_OK)\n        return JNI_ERR;"
          new = "res = (*vm)->GetEnv (vm, (void **)&env, JNI_VERSION_1_6);\n    if (res != JNI_OK) {\n        res = (*vm)->GetEnv (vm, (void **)&env, JNI_VERSION_1_4);\n        if (res != JNI_OK) return JNI_ERR;\n    }"
          c = c.replace(old, new)
          old_reg = "res = (*env)->RegisterNatives (env, klass, native_methods,\n                                   N_ELEMENTS (native_methods));\n    (*env)->DeleteLocalRef (env, klass);\n    if (res < 0)\n        return JNI_ERR;"
          new_reg = """res = (*env)->RegisterNatives (env, klass, native_methods, N_ELEMENTS (native_methods));
              if (res < 0) {
                  if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
                  static JNINativeMethod fallback_methods[] = {
                      { "TProxyStartService", "(Ljava/lang/String;I)V", (void *)native_start_service },
                      { "TProxyStopService", "()V", (void *)native_stop_service },
                      { "TProxyGetStats", "()[J", (void *)native_get_stats },
                  };
                  (*env)->RegisterNatives (env, klass, fallback_methods, 3);
                  if ((*env)->ExceptionCheck(env)) (*env)->ExceptionClear(env);
              }
              (*env)->DeleteLocalRef (env, klass);"""
          c = c.replace(old_reg, new_reg)
          c = c.replace("return JNI_VERSION_1_4;", "return JNI_VERSION_1_6;")
          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          print("tun2socks JNI patched successfully")
          '

          cd ..
          "$ANDROID_HOME/ndk/26.3.11579264/ndk-build" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs" \
            APP_ABI="arm64-v8a armeabi-v7a x86_64" \
            APP_PLATFORM=android-24
          ls -R "$GITHUB_WORKSPACE/app/src/main/jniLibs"

      # Noyau Xray natif (VLESS, VMess, Trojan) pour arm64-v8a, armeabi-v7a et x86_64
      - name: Télécharger le noyau Xray
        run: |
          set -e
          mkdir -p xray && cd xray
          curl -fsSL -o a64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip
          curl -fsSL -o a32.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm32-v7a.zip
          curl -fsSL -o ax64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o a64.zip xray -d a64
          unzip -o a32.zip xray -d a32
          unzip -o ax64.zip xray -d ax64
          J="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          mkdir -p "$J/arm64-v8a" "$J/armeabi-v7a" "$J/x86_64"
          cp a64/xray "$J/arm64-v8a/libxray.so"
          cp a32/xray "$J/armeabi-v7a/libxray.so"
          cp ax64/xray "$J/x86_64/libxray.so"
          ls -la "$J"/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "A_SIGN=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_B64 non configuré : compilation debug avec clé standard"
            echo "A_SIGN=false" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$A_SIGN" = "true" ]; then
            gradle assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Vérifier la signature
        run: |
          for f in app/build/outputs/apk/*/*.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$f" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: NexaVpnPro-apk
          path: app/build/outputs/apk/*/*.apk

      - name: Publier l'APK dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/*/*.apk | head -n 1)"
          NAME="NexaVpnPro-v0.8.3-build${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          gh release create "v0.8.3" "$NAME" \
            --title "NEXA VPN PRO v0.8.3" \
            --notes "🛡️ **NEXA VPN PRO v0.8.3** — Correction native tun2socks (RegisterNatives Z/V et JNI_VERSION_1_6), support complet arm64-v8a, armeabi-v7a et x86_64, et autorisation du trafic cleartext pour les tests de connectivité." \
            --latest || gh release upload "v0.8.3" "$NAME" --clobber
